<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ELIT SEA Esports Network</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #000 0%, #111 100%);
      color: #FFD700;
      text-align: center;
    }
    header {
      background-color: #000;
      padding: 20px;
      border-bottom: 2px solid #FFD700;
    }
    h1 {
      font-size: 2.5em;
      margin: 20px 0;
      animation: fadeIn 2s ease-in-out;
    }
    .subtitle {
      font-size: 1.2em;
      color: #ccc;
      margin-bottom: 30px;
    }
    .small img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-bottom: 2px solid #FFD700;
    }
    .news {
      padding: 40px 20px;
    }
    .news h2 {
      font-size: 1.8em;
      margin-bottom: 20px;
      border-bottom: 1px solid #FFD700;
      display: inline-block;
      padding-bottom: 5px;
    }
    .card {
      background-color: #222;
      margin: 10px auto;
      padding: 15px;
      max-width: 600px;
      border: 1px solid #FFD700;
      border-radius: 8px;
      animation: slideUp 1s ease-in-out;
    }
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #000;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #FFA500;
    }
    footer {
      background-color: #000;
      padding: 15px;
      margin-top: 40px;
      border-top: 2px solid #FFD700;
      color: #ccc;
    }

      from {opacity: 0;}
